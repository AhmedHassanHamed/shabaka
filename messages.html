<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e6b57" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>الرسائل | شبكة Shabaka</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="sub">
      <div class="w">
        <a class="logo" href="index.html"
          ><img src="assets/logo.svg" alt="" width="34" height="34" /><span
            >شبكة</span
          ></a
        >
        <nav aria-label="Main">
          <a href="index.html">الرئيسية</a><a href="community.html">المجتمع</a
          ><a href="reviews.html">التقييمات</a><a href="profile.html">ملفي</a>
        </nav>
      </div>
    </header>
    <main class="pg">
      <section>
        <div class="w">
          <h1>الرسائل</h1>
          <p class="sub">
            محادثاتك الخاصة مع الطرف الآخر في مشروعك. لا يراها غيركما.
          </p>

          <p class="note" id="nc" hidden>
            الرسائل قيد التجهيز وستكون متاحة قريبًا.
          </p>

          <div class="c" id="login" hidden>
            <h3>تسجيل الدخول</h3>
            <p>ادخل ببريدك وكلمة المرور اللذين زوّدناك بهما.</p>
            <form id="lf">
              <div class="fld">
                <label for="em">البريد الإلكتروني</label
                ><input
                  id="em"
                  type="email"
                  autocomplete="email"
                  required
                  dir="ltr"
                />
              </div>
              <div class="fld">
                <label for="pw">كلمة المرور</label
                ><input
                  id="pw"
                  type="password"
                  autocomplete="current-password"
                  minlength="8"
                  required
                />
              </div>
              <button class="btn" type="submit">دخول</button>
            </form>
            <p class="tk" id="lm" role="status"></p>
          </div>

          <div class="chat" id="app" hidden>
            <aside class="side">
              <h3>محادثاتك</h3>
              <div id="list"></div>
              <button class="link" id="out" type="button">تسجيل الخروج</button>
            </aside>
            <div class="th">
              <div class="top">
                <button class="link back" id="bk" type="button">← رجوع</button
                ><strong id="ttl" class="tk">اختر محادثة</strong
                ><button class="link" id="done" type="button" hidden>
                  اعتماد اكتمال المشروع</button
                ><a class="link" id="pf" href="freelancer.html" hidden
                  >ملف المستقل</a
                >
              </div>
              <div id="msgs" aria-live="polite"></div>
              <form class="composer" id="sf" hidden>
                <textarea
                  id="tx"
                  rows="2"
                  maxlength="2000"
                  required
                  aria-label="رسالتك"
                ></textarea
                ><button class="btn" type="submit" id="sb">إرسال</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <noscript><p class="ns">يتطلب هذا الموقع JavaScript.</p></noscript>
    <script src="js/chat-config.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
